<div class="flex flex-col min-h-screen">

  <app-header
    [isMenuOpen]="isMenuOpen"
    [currentLanguage]="currentLanguage"
    [currentUser]="currentUser"
    [avatarUrl]="avatarUrl"
    [canInstallPwa]="canInstallPwa"
    (menuToggle)="toggleMenu()"
    (installPwaClick)="installPwa()">
  </app-header>

  <!-- Menu Component -->
  <app-menu [isOpen]="isMenuOpen"
    (menuClosed)="closeMenu()"
    [language]="currentLanguage"
    [userData]="currentUser">
  </app-menu>

  <!-- Main Content -->
  <main
    class="flex-1 overflow-auto"
    tabindex="-1"
    (click)="closeMenu()"
    (keydown.escape)="closeMenu()">
    <router-outlet></router-outlet>
  </main>

  @if (!loading) {
    <app-up-button></app-up-button>
  }
  @if (currentUser) {
    <app-music-player></app-music-player>
  }
  @if (!loading) {
    <app-search-button></app-search-button>
  }
  <app-footer></app-footer>
  <app-loading-spinner [loading]="loading"></app-loading-spinner>
  <app-new-update-view></app-new-update-view>
  <app-error-message-view></app-error-message-view>
</div>
